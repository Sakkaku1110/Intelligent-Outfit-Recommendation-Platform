<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>智能衣橱</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-view="today">
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">SS928 Smart Wardrobe</p>
          <h1>智能衣橱</h1>
        </div>
        <span id="statusPill" class="status-pill">连接中</span>
      </header>

      <section id="todayView" class="view active">
        <section class="hero-card">
          <div class="hero-copy">
            <p id="weatherLine" class="eyebrow">Chengdu</p>
            <h2 id="todayTitle">今日推荐</h2>
            <p id="todaySummary">正在读取衣橱</p>
          </div>
          <div class="hero-metrics">
            <div>
              <strong id="tempMetric">--</strong>
              <span>温度</span>
            </div>
            <div>
              <strong id="countMetric">--</strong>
              <span>衣物</span>
            </div>
            <div>
              <strong id="cameraMetric">--</strong>
              <span>摄像头</span>
            </div>
          </div>
        </section>

        <section class="control-card">
          <label>
            城市
            <input id="cityInput" value="Chengdu" />
          </label>
          <label>
            场景
            <select id="occasionSelect">
              <option value="school">上课</option>
              <option value="commute">通勤</option>
              <option value="casual">休闲</option>
              <option value="sport">运动</option>
              <option value="formal">正式</option>
              <option value="date">约会</option>
            </select>
          </label>
          <button id="refreshBtn" class="icon-button" type="button" aria-label="刷新">刷新</button>
        </section>

        <section id="mirrorPanel" class="mirror-panel"></section>
        <section id="recommendList" class="recommend-list"></section>
      </section>

      <section id="captureView" class="view">
        <section class="capture-card">
          <div class="camera-frame">
            <img id="cameraStream" src="/api/camera/stream" alt="实时取景" />
            <div class="viewfinder"></div>
            <div class="camera-overlay">
              <div id="pipelineChip" class="pipeline-chip">云边协同</div>
              <button id="analyzeCaptureBtn" class="capture-button" type="button">拍照识别</button>
            </div>
          </div>
          <div class="pipeline-row">
            <span id="cloudStatus">云端主体</span>
            <span>边缘识别</span>
            <span>人工审核</span>
          </div>
        </section>
      </section>

      <section id="reviewView" class="view">
        <section class="review-card">
          <div class="review-header">
            <div>
              <p class="eyebrow">AI 入库审核</p>
              <h2 id="reviewTitle">确认这件衣物</h2>
            </div>
            <span id="reviewBadge" class="status-pill soft">待确认</span>
          </div>

          <img id="reviewImage" class="review-image" alt="识别结果" />

          <div class="pipeline-detail">
            <div>
              <span>云端主体</span>
              <strong id="cloudDetail">未启用</strong>
            </div>
            <div>
              <span>边缘模型</span>
              <strong id="edgeDetail">等待识别</strong>
            </div>
          </div>

          <form id="reviewForm" class="review-form">
            <label>
              名称
              <input name="name" />
            </label>
            <label>
              类别
              <select name="category">
                <option value="top">上衣</option>
                <option value="bottom">裤子</option>
                <option value="outer">外套</option>
                <option value="shoes">鞋子</option>
                <option value="accessory">配饰</option>
              </select>
            </label>
            <label>
              颜色
              <input name="color" />
            </label>
            <label>
              材质
              <input name="material" />
            </label>
            <label>
              保暖
              <input name="warmth" type="number" min="1" max="5" />
            </label>
            <label>
              偏好
              <input name="favorite_score" type="number" min="1" max="5" />
            </label>
            <label>
              季节
              <input name="season" />
            </label>
            <label>
              场景
              <input name="occasion" />
            </label>
            <section class="commerce-box">
              <div class="commerce-head">
                <strong>淘宝商家图</strong>
                <button id="reviewTaobaoBtn" class="secondary-btn small-btn" type="button">导入展示图</button>
              </div>
              <label>
                淘宝链接
                <input id="reviewTaobaoLink" name="source_url" placeholder="粘贴 e.tb.cn / item.taobao.com 链接" />
              </label>
              <label>
                商家图片链接
                <input id="reviewMerchantImage" name="merchant_image_url" placeholder="可选：淘宝链接无法自动取图时粘贴图片地址" />
              </label>
              <p id="reviewTaobaoStatus" class="commerce-hint"></p>
            </section>
            <div id="reviewConfidence" class="confidence-card"></div>
            <div class="review-actions">
              <button id="retakeBtn" class="secondary-btn" type="button">重拍</button>
              <button id="saveReviewBtn" class="primary-btn" type="submit">确认入库</button>
            </div>
          </form>
        </section>
      </section>

      <section id="wardrobeView" class="view">
        <section class="closet-header">
          <div>
            <p class="eyebrow">Closet</p>
            <h2>衣物库</h2>
          </div>
          <div class="closet-actions">
            <button id="manualAddBtn" class="icon-button" type="button">新增</button>
            <button id="closetRefreshBtn" class="icon-button" type="button">刷新</button>
          </div>
        </section>
        <section class="closet-tools">
          <label>
            搜索
            <input id="closetSearchInput" placeholder="名称 / 颜色 / 材质" />
          </label>
          <label>
            分类
            <select id="closetCategoryFilter">
              <option value="all">全部</option>
              <option value="top">上衣</option>
              <option value="bottom">裤子</option>
              <option value="outer">外套</option>
              <option value="shoes">鞋子</option>
              <option value="accessory">配饰</option>
            </select>
          </label>
        </section>
        <div id="wardrobeGrid" class="wardrobe-grid"></div>
      </section>
    </main>

    <div id="itemEditor" class="editor-backdrop" hidden>
      <section class="editor-sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
        <div class="review-header">
          <div>
            <p class="eyebrow">Clothing Detail</p>
            <h2 id="editorTitle">编辑衣物</h2>
          </div>
          <button id="closeEditorBtn" class="icon-button close-button" type="button" aria-label="关闭">×</button>
        </div>
        <img id="editorPreview" class="editor-preview" alt="衣物预览" />
        <form id="itemEditForm" class="review-form">
          <input name="id" type="hidden" />
          <input name="image_url" type="hidden" />
          <input name="image_path" type="hidden" />
          <input name="display_image_url" type="hidden" />
          <input name="display_image_path" type="hidden" />
          <input name="source_platform" type="hidden" />
          <input name="source_item_id" type="hidden" />
          <input name="source_title" type="hidden" />
          <input name="merchant_image_path" type="hidden" />
          <label>
            名称
            <input name="name" />
          </label>
          <label>
            类别
            <select name="category">
              <option value="top">上衣</option>
              <option value="bottom">裤子</option>
              <option value="outer">外套</option>
              <option value="shoes">鞋子</option>
              <option value="accessory">配饰</option>
            </select>
          </label>
          <label>
            颜色
            <input name="color" />
          </label>
          <label>
            材质
            <input name="material" />
          </label>
          <label>
            保暖
            <input name="warmth" type="number" min="1" max="5" />
          </label>
          <label>
            偏好
            <input name="favorite_score" type="number" min="1" max="5" />
          </label>
          <label>
            季节
            <input name="season" />
          </label>
          <label>
            场景
            <input name="occasion" />
          </label>
          <label>
            备注
            <input name="note" />
          </label>
          <section class="commerce-box">
            <div class="commerce-head">
              <strong>淘宝商家图</strong>
              <button id="editorTaobaoBtn" class="secondary-btn small-btn" type="button">导入展示图</button>
            </div>
            <label>
              淘宝链接
              <input id="editorTaobaoLink" name="source_url" placeholder="粘贴 e.tb.cn / item.taobao.com 链接" />
            </label>
            <label>
              商家图片链接
              <input id="editorMerchantImage" name="merchant_image_url" placeholder="可选：粘贴商品主图地址" />
            </label>
            <p id="editorTaobaoStatus" class="commerce-hint"></p>
          </section>
          <div class="review-actions">
            <button id="deleteEditBtn" class="secondary-btn danger" type="button">删除</button>
            <button id="saveEditBtn" class="primary-btn" type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-view="today" type="button"><span>今日</span></button>
      <button class="nav-item" data-view="capture" type="button"><span>入库</span></button>
      <button class="nav-item" data-view="wardrobe" type="button"><span>衣橱</span></button>
    </nav>

    <div id="toast" class="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>
